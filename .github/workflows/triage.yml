name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest -q

  triage:
    # TRIAGE triages its own pull requests. The budget is capped so the job
    # stays bounded on a large diff; exhausting it abstains, which routes the
    # remaining hunks to a human rather than passing them through.
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # TRIAGE needs the merge base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Triage the diff
        run: |
          triage run \
            --repo . \
            --base "origin/${{ github.base_ref }}" \
            --budget 180 \
            --format md \
            --out triage-report.md
          cat triage-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-report
          path: triage-report.md
