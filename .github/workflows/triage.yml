name: TRIAGE

on:
  pull_request:

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # TRIAGE needs the merge base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Triage the diff
        run: |
          triage run \
            --repo . \
            --base "origin/${{ github.base_ref }}" \
            --format md \
            --out triage-report.md
          cat triage-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-report
          path: triage-report.md
