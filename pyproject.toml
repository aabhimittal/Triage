[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triage-review"
version = "0.1.0"
description = "Prove what can be proved about a pull request; send only the unproven remainder to a human."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["coverage>=7.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: replays real commits; several seconds each"]
